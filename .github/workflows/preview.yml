name: Preview pull request
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [feature/production-cockpit-billing, feature/personal-route-builder]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: learner-preview-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false
env:
  PAGES_PROJECT: learner-drive-app
  WRANGLER_SEND_METRICS: 'false'
  WRANGLER_LOG_PATH: /tmp/wrangler.log
jobs:
  preview:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: cloudflare
    timeout-minutes: 25
    outputs:
      visual: ${{ steps.deploy.outcome }}
      smoke: ${{ steps.smoke.outcome }}
      billing: ${{ steps.billing.outputs.ready || steps.billing.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm test
      - run: npm test --prefix server
      - run: npm run check --prefix server
      - name: Set isolated preview alias
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node tools/preview-context.mjs
      - run: node tools/build_demo.mjs . dist --preview
      - name: Deploy visual preview only
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUD_FLAIR_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUD_FLAIR_ID }}
        run: node server/node_modules/wrangler/bin/wrangler.js pages deploy dist --project-name "$PAGES_PROJECT" --branch "$PREVIEW_ALIAS" --commit-hash "$(git rev-parse HEAD)"
      - run: npx playwright install --with-deps chromium
      - name: Verify the deployed cockpit
        id: smoke
        run: node tests/cockpit-browser.mjs
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify personal route interactions
        run: node tests/personal-routes-browser.mjs
      - name: Verify road marking renderer
        run: node tests/tile-markings-browser.mjs
      - name: Verify one kilometre tile prototype
        run: TEST_SITE=dist LIVE_TILE=1 node tests/tile-builder-browser.mjs
      - name: Verify mobile panels
        run: node tests/modal-layout-browser.mjs
      - name: Verify live map providers separately
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: node tools/check-personal-providers.mjs
      - name: Prepare isolated Stripe test-mode backend when configured
        id: billing
        continue-on-error: true
        working-directory: server
        run: node tools/deploy-billing-preview.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUD_FLAIR_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUD_FLAIR_ID }}
          PREVIEW_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
          PREVIEW_DATABASE_HOST: ${{ vars.PREVIEW_DATABASE_HOST }}
          PRODUCTION_DATABASE_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
          PREVIEW_CLERK_SECRET_KEY: ${{ secrets.PREVIEW_CLERK_SECRET_KEY }}
          PREVIEW_CLERK_PUBLISHABLE_KEY: ${{ vars.PREVIEW_CLERK_PUBLISHABLE_KEY }}
          PREVIEW_STRIPE_SECRET_KEY: ${{ secrets.PREVIEW_STRIPE_SECRET_KEY }}
          PREVIEW_STRIPE_PRICE_ID: ${{ vars.PREVIEW_STRIPE_PRICE_ID }}
      - name: Build separate billing sandbox without guest entitlement bypass
        if: steps.billing.outputs.ready == 'true'
        run: node tools/build_demo.mjs . dist-billing --billing-preview
        env:
          PREVIEW_CLERK_PUBLISHABLE_KEY: ${{ vars.PREVIEW_CLERK_PUBLISHABLE_KEY }}
      - name: Deploy billing sandbox only
        if: steps.billing.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUD_FLAIR_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUD_FLAIR_ID }}
        run: node server/node_modules/wrangler/bin/wrangler.js pages deploy dist-billing --project-name "$PAGES_PROJECT" --branch "$PREVIEW_ALIAS-billing" --commit-hash "$(git rev-parse HEAD)"
      - name: Post preview links on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node tools/comment-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cockpit-preview-evidence
          path: test-results/
      - name: Surface configured billing deployment failures
        if: steps.billing.outcome == 'failure'
        run: exit 1
  receipt:
    needs: preview
    if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: cockpit-preview-evidence
          path: release-evidence
      - run: node tools/record-cockpit-preview.mjs
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_RESULT: ${{ needs.preview.result }}
          VISUAL_RESULT: ${{ needs.preview.outputs.visual }}
          SMOKE_RESULT: ${{ needs.preview.outputs.smoke }}
          BILLING_RESULT: ${{ needs.preview.outputs.billing }}
