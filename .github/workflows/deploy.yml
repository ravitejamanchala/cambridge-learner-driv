name: Deploy app to Cloudflare Pages

# Same mechanism as the SlayDrive marketing site: every push to main installs,
# tests and builds, then uploads dist/ to Cloudflare Pages. Failed tests stop
# the deploy and leave the live app on its previous version.
#
# The API Worker is NOT redeployed on every push. Run this workflow manually
# with "deploy_worker" ticked when the Worker code or its variables change
# (for example the one-off switch of FRONTEND_URL to app.slaydrive.com).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_worker:
        description: Also deploy the learner-drive-api Worker
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-app-production
  cancel-in-progress: false

env:
  PAGES_PROJECT: learner-drive-app
  WRANGLER_SEND_METRICS: 'false'
  WRANGLER_LOG_PATH: /tmp/wrangler.log

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - run: npm ci
      - run: npm ci --prefix server
      - run: npm test
      - run: npm test --prefix server
      - run: npm run check --prefix server

      # Public values only. Set them as environment *variables* (not secrets)
      # in Settings > Environments > cloudflare. If they are not set, the
      # committed auth-config.js is used unchanged.
      - name: Write public auth config
        if: ${{ vars.CLERK_PUBLISHABLE_KEY != '' && vars.API_BASE_URL != '' }}
        env:
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: node tools/configure-auth.mjs

      - run: npm run build

      - name: Create Pages project if it does not exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch main || true

      - name: Deploy app to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name "$PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA"

      - name: Deploy API Worker
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_worker }}
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
