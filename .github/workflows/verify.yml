name: Verify simulator and API
on:
  push:
    branches: ['recovery/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm test
      - run: npm test --prefix server
      - run: npm run check --prefix server
      - run: npm run build
      - run: npm run dry-run --prefix server
        env:
          WRANGLER_LOG_PATH: /tmp/wrangler-setup.log
          WRANGLER_SEND_METRICS: 'false'
