name: Sandbox branch

# A long-lived `sandbox` branch for trying things out (map, lesson or marking JSON) in the real app, at a
# fixed address:
#   https://sandbox.learner-drive-app.pages.dev
# Every push to `sandbox` is built and deployed there. Every push to main is merged into `sandbox` first,
# so what you try always runs on the latest app. If your changes conflict with main the merge stops and
# this run fails, saying so; nothing is resolved for you.
#
# Like the pull-request previews (preview.yml) it is a Cloudflare Pages *branch* deployment: it runs as a
# guest with the whole course open, syncs nothing, and never touches production (main, deploy.yml).
# Tests run and are reported, but do not stop the deploy: the point is to see what your JSON does.

on:
  push:
    branches: [main, sandbox]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sandbox
  cancel-in-progress: false

env:
  PAGES_PROJECT: learner-drive-app
  BRANCH: sandbox
  WRANGLER_SEND_METRICS: 'false'
  WRANGLER_LOG_PATH: /tmp/wrangler.log

jobs:
  sandbox:
    runs-on: ubuntu-latest
    environment: cloudflare
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sandbox
          fetch-depth: 0

      # main moved on: bring it into the sandbox (a push made with this workflow's token starts no other
      # workflow, so this same run goes on to deploy)
      - name: Merge main into the sandbox
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898333+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if ! git merge --no-edit origin/main; then
            git merge --abort
            echo "::error::The sandbox branch conflicts with main. Merge main into sandbox by hand and resolve the conflict."
            exit 1
          fi
          git push origin HEAD:sandbox

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - name: Tests (reported, not blocking)
        run: npm test
        continue-on-error: true
      - run: node tools/build_demo.mjs . dist --preview

      - name: Deploy to the sandbox address
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUD_FLAIR_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUD_FLAIR_ID }}
        run: |
          npx --yes wrangler@4 pages deploy dist --project-name "$PAGES_PROJECT" \
            --branch "$BRANCH" --commit-hash "$(git rev-parse HEAD)"
          echo "### Sandbox: https://$BRANCH.$PAGES_PROJECT.pages.dev/ (commit $(git rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"
